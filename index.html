		<h1 align="center">洛阳牡丹</h1>
		<hr size="6px" color="green">
		<h1 align="center">赏牡丹</h1>
		<p align="center">唐・刘禹锡</p>
		<p align="center">
			<br>庭前芍药妖无格，
			池上芙蕖净少情。
			<br />唯有牡丹真国色，
			花开时节动京城。<br />
			<br />
			&nbsp&nbsp这首诗写于唐代，"<strong>当时长安赏牡丹风气极盛</strong>"。"<ins><em>诗里的 “京城” 指长安，不是洛阳</em>"</ins>
		很多人会误以为写洛阳牡丹，是因为后世洛阳牡丹名气最大，现代歌曲《洛阳牡丹》引用了这首诗，所以经常把它和洛阳牡丹绑定在一起
		</p>
